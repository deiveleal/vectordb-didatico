[project]
name = "vectordb-didatico"
version = "0.1.0"
description = "Versao didatica do pipeline arXiv -> busca semantica, em Python puro e sem API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",   # parse do HTML do arXiv
    "ctranslate2>=4.8.5",       # motor do modelo de traducao pt -> en
    "fastapi>=0.162.0",         # API de busca
    "fastembed>=0.9.1",         # embeddings e reranker em ONNX, na CPU
    "pymupdf>=2.1",             # texto do PDF, quando nao ha HTML
    "qdrant-client>=1.20.0",    # banco vetorial em modo local
    "requests>=2.34.2",
    "sentencepiece>=0.2.2",     # subpalavras do modelo de traducao
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
# sem stubs de tipo publicados
module = ["ctranslate2.*", "sentencepiece.*", "pymupdf.*", "fastembed.*"]
ignore_missing_imports = true
